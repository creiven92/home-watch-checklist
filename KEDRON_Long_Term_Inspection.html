<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KEDRON Long-Term Property Inspection</title>
<style>
:root{--teal:#073b3a;--teal2:#0d5752;--gold:#c6a15b;--cream:#f6f0e4;--paper:#fffdf8;--ink:#18302f;--muted:#687977;--line:#d9d7cf;--ok:#25815e;--warn:#d49a20;--urgent:#bd3e39;--blue:#3d7181;--shadow:0 10px 35px #062e2d20}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:15px/1.45 Inter,Segoe UI,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:20;background:linear-gradient(115deg,var(--teal),#092e2e);color:white;padding:12px clamp(14px,3vw,34px);display:flex;align-items:center;gap:16px;box-shadow:0 4px 18px #0003}.brand{min-width:190px}.brand b{font:700 24px Georgia,serif;letter-spacing:.18em;color:var(--gold)}.brand small{display:block;letter-spacing:.08em;opacity:.8}.progress{height:5px;flex:1;background:#ffffff26;border-radius:9px;overflow:hidden}.progress i{display:block;height:100%;width:15%;background:var(--gold);transition:.3s}.top .ghost{border-color:#ffffff55;color:white}.shell{display:grid;grid-template-columns:230px minmax(0,980px);justify-content:center;gap:24px;padding:24px}.side{position:sticky;top:86px;height:max-content;background:#fffaf0;border:1px solid #e2d6bf;border-radius:16px;padding:10px;box-shadow:var(--shadow)}.side button{width:100%;border:0;background:transparent;text-align:left;padding:11px;border-radius:9px;color:var(--ink)}.side button.active{background:var(--teal);color:white}.side button.done:after{content:' ✓';color:var(--gold);float:right}.main{min-width:0}.panel{display:none;background:var(--paper);border:1px solid #e2d6bf;border-radius:18px;padding:clamp(18px,3vw,32px);box-shadow:var(--shadow)}.panel.active{display:block}.eyebrow{color:var(--gold);font-weight:800;text-transform:uppercase;letter-spacing:.14em;font-size:12px}h1,h2,h3{font-family:Georgia,serif;color:var(--teal)}h1{margin:.2em 0;font-size:clamp(29px,5vw,47px);line-height:1.05}h2{margin:.2em 0 1em;font-size:28px}h3{margin:0;font-size:20px}.lead{color:var(--muted);max-width:700px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.grid.three{grid-template-columns:repeat(3,1fr)}label.field{display:flex;flex-direction:column;gap:6px;font-weight:700;color:var(--teal)}input,select,textarea{width:100%;border:1px solid #bfc9c5;background:white;border-radius:9px;padding:11px;color:var(--ink)}textarea{min-height:78px;resize:vertical}input:focus,select:focus,textarea:focus{outline:3px solid #c6a15b35;border-color:var(--gold)}.full{grid-column:1/-1}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}.btn{border:0;border-radius:10px;background:var(--teal);color:white;padding:11px 17px;font-weight:800}.btn.gold{background:var(--gold);color:#203331}.btn.soft{background:#e7efec;color:var(--teal)}.btn.danger{background:#fae7e4;color:var(--urgent)}.btn.small{padding:7px 11px;font-size:13px}.ghost{border:1px solid #b8c7c2;background:transparent;color:var(--teal);border-radius:10px;padding:10px 14px}.notice{padding:12px 14px;border-left:4px solid var(--gold);background:#fbf4e5;border-radius:8px;margin:14px 0}.cards{display:grid;gap:14px}.card{border:1px solid var(--line);border-radius:13px;background:white;padding:14px}.card-head{display:flex;gap:10px;align-items:center;justify-content:space-between}.card-head .title{font-weight:800;color:var(--teal)}.row-actions{display:flex;gap:7px;flex-wrap:wrap}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.chip{border:1px solid #c7d0cc;background:white;border-radius:999px;padding:7px 11px}.chip.on{background:var(--teal);color:white;border-color:var(--teal)}.check{border-top:1px solid #e4e6e1;padding:12px 0}.check:first-child{border-top:0}.check-top{display:grid;grid-template-columns:minmax(150px,1fr) auto;gap:12px;align-items:center}.status{display:flex;gap:5px;flex-wrap:wrap}.status button{border:1px solid #cad2cf;background:white;border-radius:8px;padding:7px 9px;font-size:13px}.status button[data-s=ok].on{background:var(--ok);color:white}.status button[data-s=warn].on{background:var(--warn);color:white}.status button[data-s=urgent].on{background:var(--urgent);color:white}.status button[data-s=na].on,.status button[data-s=nt].on,.status button[data-s=noaccess].on{background:#687977;color:white}.detail{display:none;margin-top:12px;padding:13px;background:#f8f5ed;border-radius:10px}.check.issue .detail{display:block}.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:8px}.photo{position:relative;border:1px solid #d5d8d3;border-radius:9px;overflow:hidden;background:white}.photo img{width:100%;height:120px;object-fit:cover;display:block}.photo .meta{padding:7px;font-size:12px}.photo button{position:absolute;right:5px;top:5px;border:0;background:#000a;color:white;border-radius:50%;width:26px;height:26px}.sectionbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:23px 0 10px;padding-bottom:8px;border-bottom:2px solid var(--gold)}.summary-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:9px}.stat{border-radius:12px;padding:14px;background:#eef3ef;text-align:center}.stat b{display:block;font-size:24px;color:var(--teal)}.findings{display:grid;gap:10px;margin-top:15px}.finding{border-left:5px solid var(--warn);background:white;padding:12px;border-radius:8px}.finding.urgent{border-color:var(--urgent)}.muted{color:var(--muted)}.hidden{display:none!important}.privacy{font-size:12px;color:#d9e6e1;margin-left:auto}.toggleline{display:flex;align-items:center;gap:8px;margin:12px 0}.pill{display:inline-block;padding:3px 8px;border-radius:99px;background:#e8eeeb;font-size:12px}.report-overlay{display:none;position:fixed;inset:0;background:#505453;z-index:100;padding:20px;overflow:auto}.report-toolbar{position:sticky;top:0;z-index:2;display:flex;gap:10px;justify-content:center;padding:10px;background:#203331;color:white}.report-pages{display:grid;gap:18px;justify-content:center;padding:20px}.pdf-page{width:210mm;min-height:297mm;background:white;box-shadow:0 8px 30px #0005;padding:16mm 15mm 18mm;position:relative;color:#173130}.pdf-header{border-bottom:2px solid var(--gold);padding-bottom:7mm;margin-bottom:7mm}.pdf-header .logo{font:700 25px Georgia,serif;letter-spacing:.18em;color:var(--gold)}.pdf-title{font:700 28px Georgia,serif;color:var(--teal);margin-top:6mm}.pdf-address{font:700 18px Georgia,serif;margin-top:2mm}.pdf-footer{position:absolute;bottom:7mm;left:15mm;right:15mm;border-top:1px solid #d6d8d4;padding-top:3mm;display:flex;justify-content:space-between;font-size:10px;color:#667674}.pdf-section{break-inside:avoid;margin:5mm 0}.pdf-section h3{font-size:17px;border-bottom:1px solid var(--gold);padding-bottom:2mm}.pdf-item{break-inside:avoid;border-bottom:1px solid #e4e6e2;padding:2.5mm 0}.pdf-photo{max-width:100%;max-height:112mm;object-fit:contain;margin:3mm 2mm 2mm 0;border-radius:3px}.pdf-status{font-weight:800}.pdf-status.ok{color:var(--ok)}.pdf-status.warn{color:#9d6a00}.pdf-status.urgent{color:var(--urgent)}.pdf-meta{display:grid;grid-template-columns:repeat(2,1fr);gap:3mm 8mm;margin-top:4mm}.pdf-summary{display:grid;grid-template-columns:repeat(5,1fr);gap:3mm;margin:6mm 0}.pdf-summary div{background:#eef3ef;padding:4mm;text-align:center;border-radius:3mm}.pdf-summary b{display:block;font-size:19px}.cover-mark{height:5mm;background:var(--teal);margin:-16mm -15mm 10mm}.estimate{font-weight:700;color:var(--gold)}
.pdf-page{height:297mm;min-height:0;overflow:hidden}.page-body{height:218mm;overflow:hidden}
@media(max-width:760px){.shell{display:block;padding:12px}.side{position:static;display:flex;overflow:auto;margin-bottom:12px}.side button{min-width:max-content}.grid,.grid.three{grid-template-columns:1fr}.summary-grid{grid-template-columns:repeat(2,1fr)}.check-top{grid-template-columns:1fr}.privacy{display:none}.brand small{display:none}.brand{min-width:auto}.top{gap:8px}.report-overlay{padding:0}.pdf-page{transform-origin:top left}}
@media print{body>*:not(.report-overlay){display:none!important}.report-overlay{display:block!important;position:static;padding:0;background:white;overflow:visible}.report-toolbar{display:none!important}.report-pages{display:block;padding:0}.pdf-page{box-shadow:none;margin:0;page-break-after:always;width:210mm;height:297mm;overflow:hidden}.pdf-page:last-child{page-break-after:auto}@page{size:A4;margin:0}}
</style>
</head>
<body>
<header class="top"><div class="brand"><b>KEDRON</b><small>LONG-TERM PROPERTY MANAGEMENT</small></div><div class="progress"><i id="progress"></i></div><button class="ghost" onclick="previewReport()">Preview PDF</button><span class="privacy">Local session · nothing saved</span></header>
<div class="shell"><nav class="side" id="nav"></nav><main class="main" id="main"></main></div>
<div class="report-overlay" id="report"><div class="report-toolbar"><button class="btn gold" onclick="printReport()">Save as PDF</button><span id="sizeEstimate"></span><button class="ghost" onclick="closeReport()">Return to inspection</button></div><div class="report-pages" id="reportPages"></div></div>
<input id="photoInput" type="file" accept="image/*" capture="environment" multiple hidden>
<script>
'use strict';
const TYPES=['Apartment','Studio','Loft','Penthouse','Maisonette','Duplex','Detached House','Two-Storey House','Villa','Other'];
const AREA_PRESETS={
'Living / Dining':['Flooring & skirting','Walls & ceilings','Windows & glazing','Doors & hardware','Lighting & switches','Sockets','Furniture condition','Signs of moisture','Cleanliness / general condition'],
'Bedroom':['Flooring & skirting','Walls & ceilings','Windows & shutters','Door & hardware','Lighting & switches','Sockets','Wardrobes / built-ins','Furniture / mattress','Signs of moisture'],
'Bathroom / WC':['Sink & tap','Toilet & flush','Shower / bath','Drainage','Silicone & seals','Tiles & grout','Ventilation','Lighting & switches','Visible leaks','Moisture / mould'],
'Kitchen':['Cabinetry & worktops','Sink & tap','Drainage','Visible plumbing / leaks','Floor / walls','Lighting & switches','Sockets','Ventilation / extractor','Appliance condition','Signs of pests'],
'Office':['Floor / walls / ceiling','Windows & doors','Lighting & sockets','Furniture / built-ins','Connectivity points','Moisture'],
'Laundry':['Water connections','Drainage','Ventilation','Electrical supply','Appliances','Leaks / moisture','Storage'],
'Storage / Pantry / Dressing':['Shelving / cabinetry','Door / lock','Lighting','Ventilation','Damp / pests','General condition'],
'Balcony / Terrace':['Surface / tiles','Drainage','Railings / safety','Waterproofing signs','Doors / glazing','Lighting / sockets','Awnings / pergola','Furniture'],
'Exterior / Yard / Garden':['Boundary / fencing','Paths / paving','External walls','Drainage','Outdoor lighting','Outdoor taps','Yard condition (not plant care)','Safety hazards'],
'Pool / Jacuzzi':['Water appearance','Structure / lining','Coping / surround','Cover','Pump / filter equipment','Heating equipment','Lighting','Safety / access'],
'Garage / Parking / Driveway':['Access / remote','Door / gate mechanism','Surface condition','Lighting','Sockets / EV provision','Drainage','Safety / security'],
'Special Room':['Floor / walls / ceiling','Doors / windows','Lighting & power','Ventilation','Fixtures / equipment','Safety','General condition']};
const AREA_TYPES=['Living / Dining','Bedroom','Bathroom / WC','Kitchen','Office','Play / Game Room','Studio / Hobby Room','Laundry','Storage / Pantry / Dressing','Attic / Basement / Cellar','Gym / Cinema / Sauna','Staff Room','Mechanical Room','Balcony / Terrace','Exterior / Yard / Garden','Pool / Jacuzzi','BBQ / Outdoor Kitchen / Pergola / Play Area','Garage / Parking / Driveway','Guest / Pool House','Special Room'];
const EQUIPMENT=['Air Conditioning','Heating / Hot Water','Boiler','Solar Water Heater','Heat Pump','Gas System','Oil System','Underfloor Heating','Radiator','Fan Coil','Thermostat','Electrical Panel','Sockets / Switches / Lighting','Plumbing / Water Supply','Security / Access','CCTV','Alarm','Intercom','Smart Lock','Gate / Shutter','Irrigation Equipment','Pool Equipment','EV Charger','Generator','Elevator','Custom Equipment'];
const APPLIANCES=['Refrigerator','Freezer','Oven','Hob','Extractor Hood','Dishwasher','Washing Machine','Dryer','Microwave','Wine Cooler','Television','Small Appliances','Other'];
const GENERAL=[['Access & Occupancy',['Keys / remotes accounted for','Security door / entry','Mailbox access','Tenant-reported issues recorded']],['Safety & Environment',['Smoke detector (if present)','CO detector (if present)','Fire extinguisher (if present)','Signs of pests','Unusual odours','Noise / vibration','Common-building issues']],['Utilities & Records',['Electricity meter / reading','Water meter / reading','Gas meter / reading','Main water shut-off location','Electrical main panel location','Gas shut-off location']]];
const state={step:0,meta:{date:new Date().toISOString().slice(0,10),type:'6-Month Routine',tenant:'Not present',access:'Property manager key',furnishing:'Furnished',quality:'High'},levels:['Level 1'],areas:[],equipment:[],appliances:[],general:[],photos:{},photoBytes:0};
const steps=['Property','Areas','Systems','Contents','General','Review & PDF'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
function init(){GENERAL.forEach(([group,checks])=>checks.forEach(name=>state.general.push(item(name,group))));renderNav();render();}
function item(name,group='',location=''){return{id:uid(),name,group,location,status:'',detail:'',tech:'No',techType:'',priority:'Monitor',responsibility:'Undetermined',follow:'No',followState:'',exception:'',photoReason:'',photos:[]}}
function renderNav(){nav.innerHTML=steps.map((x,i)=>`<button class="${i===state.step?'active':''} ${i<state.step?'done':''}" onclick="go(${i})">${i+1}. ${x}</button>`).join('');progress.style.width=((state.step+1)/steps.length*100)+'%'}
function go(i){state.step=i;renderNav();render();scrollTo({top:0,behavior:'smooth'})}
function render(){main.innerHTML=`<section class="panel active">${[propertyUI,areasUI,equipmentUI,contentsUI,generalUI,reviewUI][state.step]()}</section>`;bindInputs();}
function footer(){return`<div class="actions">${state.step?'<button class="ghost" onclick="go(state.step-1)">Back</button>':''}${state.step<5?'<button class="btn gold" onclick="go(state.step+1)">Continue</button>':'<button class="btn gold" onclick="previewReport()">Build PDF Preview</button>'}</div>`}
function propertyUI(){let multi=['Maisonette','Duplex','Two-Storey House','Villa'].includes(state.meta.propertyType);let ask=['Loft','Detached House','Other','Apartment','Studio','Penthouse'].includes(state.meta.propertyType);return`<div class="eyebrow">Inspection setup</div><h1>KEDRON Property Inspection</h1><p class="lead">Configure the real property layout once, then inspect quickly. All data and photos remain only in this browser session.</p><div class="grid">
${field('Property address','address','text',true)}${field('Property reference','ref')}${selectF('Inspection type','type',['6-Month Routine','Move-In','Move-Out','Special'])}${field('Inspection date','date','date')}${field('Inspector','inspector')}${selectF('Property type','propertyType',['',...TYPES])}</div>
<div class="sectionbar"><h3>Landlord information</h3></div><div class="grid">${field('Landlord name','landlordName')}${field('Landlord telephone','landlordPhone','tel')}${field('Landlord email','landlordEmail','email')}</div>
<div class="sectionbar"><h3>Tenant / client information</h3></div><div class="grid">${field('Tenant / client name','tenantName')}${field('Tenant telephone','tenantPhone','tel')}${field('Tenant email','tenantEmail','email')}${selectF('Tenant attendance','tenant',['Present','Not present','Vacant / no tenant'])}${selectF('Access method','access',['Tenant provided access','Landlord key','Property manager key','Lockbox','Other'])}<label class="field full">Tenant-reported issues <span class="muted">— separate from inspector observations</span><textarea data-meta="tenantIssues" placeholder="Record only what the tenant reported.">${esc(state.meta.tenantIssues)}</textarea></label></div>
${ask?`<div class="toggleline"><input style="width:auto" type="checkbox" data-meta="multi" ${state.meta.multi?'checked':''}> <b>${state.meta.propertyType==='Loft'?'This loft is multi-level / has a mezzanine':'This property has multiple levels'}</b></div>`:''}
${(multi||state.meta.multi)?levelsUI():''}${footer()}`}
function field(label,key,type='text',required=false){return`<label class="field">${label}${required?' *':''}<input type="${type}" data-meta="${key}" value="${esc(state.meta[key])}" ${required?'required':''}></label>`}
function selectF(label,key,opts){return`<label class="field">${label}<select data-meta="${key}">${opts.map(x=>`<option ${state.meta[key]===x?'selected':''}>${esc(x)}</option>`).join('')}</select></label>`}
function levelsUI(){return`<div class="sectionbar"><h3>Levels / floors</h3><button class="btn small soft" onclick="addLevel()">+ Add level</button></div><div class="chips">${state.levels.map((x,i)=>`<span class="chip"><input style="width:110px;border:0;padding:2px" value="${esc(x)}" onchange="state.levels[${i}]=this.value"> ${i?`<button onclick="state.levels.splice(${i},1);render()">×</button>`:''}</span>`).join('')}</div>`}
function addLevel(){state.levels.push('Level '+(state.levels.length+1));render()}
function areasUI(){return`<div class="eyebrow">Property configuration</div><h2>Rooms, areas & amenities</h2><p class="lead">Choose a preset and quantity. Names, checks and level assignments remain editable.</p><div class="grid three"><label class="field">Area type<select id="areaType">${AREA_TYPES.map(x=>`<option>${x}</option>`)}</select></label><label class="field">Quantity<input id="areaQty" type="number" min="1" max="30" value="1"></label><label class="field">Level<select id="areaLevel">${state.levels.map(x=>`<option>${esc(x)}</option>`)}</select></label></div><div class="actions"><button class="btn" onclick="addAreas()">Add area(s)</button></div><div id="areaCards" class="cards">${state.areas.map(areaCard).join('')||'<div class="notice">No areas added yet. Start with the property’s main rooms.</div>'}</div>${footer()}`}
function preset(t){let k=Object.keys(AREA_PRESETS).find(k=>t.includes(k.split(' / ')[0]))||'Special Room';return AREA_PRESETS[k]}
function addAreas(){let t=areaType.value,q=+areaQty.value||1;for(let i=0;i<q;i++){let existing=state.areas.filter(a=>a.type===t).length;state.areas.push({id:uid(),type:t,name:t+(q>1||existing?` ${existing+i+1}`:''),level:areaLevel.value,overview:[],items:preset(t).map(n=>item(n,t,areaLevel.value))})}render()}
function areaCard(a){return`<article class="card"><div class="card-head"><div><input class="title" value="${esc(a.name)}" onchange="findArea('${a.id}').name=this.value"><span class="pill">${esc(a.level)}</span></div><div class="row-actions"><button class="btn small soft" onclick="markGroup('${a.id}','ok')">✓ Mark All OK</button><button class="ghost" onclick="markGroup('${a.id}','')">Clear</button><button class="btn small danger" onclick="removeArea('${a.id}')">Remove</button></div></div><div class="actions"><button class="ghost" onclick="pickPhotos('area','${a.id}')">📷 Add overview photo</button><button class="ghost" onclick="addCheck('${a.id}')">+ Custom check</button></div><div class="photos">${photoTiles(a.overview,'area',a.id)}</div><div>${a.items.map(checkUI).join('')}</div></article>`}
function findArea(id){return state.areas.find(x=>x.id===id)}function removeArea(id){state.areas=state.areas.filter(x=>x.id!==id);render()}function addCheck(id){let n=prompt('Custom check name');if(n)findArea(id).items.push(item(n,findArea(id).name,findArea(id).level));render()}function markGroup(id,s){findArea(id).items.forEach(x=>x.status=s);render()}
function equipmentUI(){return configListUI('Systems & equipment','Add equipment with configurable counts and locations. Brand, model and serial details are optional.',EQUIPMENT,state.equipment,'equipment')}
function contentsUI(){return`<div class="eyebrow">Landlord-owned inventory</div><h2>Appliances & furnishings</h2>${selectF('Furnishing level','furnishing',['Furnished','Partially furnished','Unfurnished'])}${configListCore(APPLIANCES,state.appliances,'appliance')}${footer()}`}
function configListUI(title,lead,opts,arr,kind){return`<div class="eyebrow">Property configuration</div><h2>${title}</h2><p class="lead">${lead}</p>${configListCore(opts,arr,kind)}${footer()}`}
function configListCore(opts,arr,kind){return`<div class="grid three"><label class="field">Type<select id="cfgType">${opts.map(x=>`<option>${x}</option>`)}</select></label><label class="field">Count<input id="cfgQty" type="number" min="1" max="50" value="1"></label><label class="field">Location<select id="cfgLoc">${['Not specified',...state.levels,...state.areas.map(x=>x.name)].map(x=>`<option>${esc(x)}</option>`)}</select></label></div><div class="actions"><button class="btn" onclick="addConfig('${kind}')">Add</button></div><div class="cards">${arr.map(configCard).join('')||'<div class="notice">Nothing selected yet.</div>'}</div>`}
function addConfig(kind){let arr=kind==='equipment'?state.equipment:state.appliances;for(let i=0;i<(+cfgQty.value||1);i++)arr.push(item(cfgType.value+(+cfgQty.value>1?' '+(i+1):''),kind,cfgLoc.value));render()}
function configCard(x){return`<article class="card"><div class="card-head"><input class="title" value="${esc(x.name)}" onchange="findItem('${x.id}').name=this.value"><button class="btn small danger" onclick="removeItem('${x.id}')">Remove</button></div><div class="grid three"><label class="field">Location<input value="${esc(x.location)}" onchange="findItem('${x.id}').location=this.value"></label><label class="field">Brand / model<input value="${esc(x.brand)}" onchange="findItem('${x.id}').brand=this.value"></label><label class="field">Serial number<input value="${esc(x.serial)}" onchange="findItem('${x.id}').serial=this.value"></label></div>${checkUI(x)}</article>`}
function allItems(){return[...state.areas.flatMap(a=>a.items),...state.equipment,...state.appliances,...state.general]}
function findItem(id){return allItems().find(x=>x.id===id)}function removeItem(id){state.equipment=state.equipment.filter(x=>x.id!==id);state.appliances=state.appliances.filter(x=>x.id!==id);render()}
function generalUI(){return`<div class="eyebrow">Inspection</div><h2>General, safety & utility checks</h2>${GENERAL.map(([g])=>`<div class="sectionbar"><h3>${g}</h3><div><button class="btn small soft" onclick="markGeneral('${g}','ok')">✓ Mark All OK</button> <button class="ghost" onclick="markGeneral('${g}','')">Clear</button> <button class="ghost" onclick="customGeneral('${g}')">+ Custom check</button></div></div>${state.general.filter(x=>x.group===g).map(checkUI).join('')}`).join('')}${footer()}`}
function markGeneral(g,s){state.general.filter(x=>x.group===g).forEach(x=>x.status=s);render()}function customGeneral(g){let n=prompt('Custom check name');if(n)state.general.push(item(n,g));render()}
function checkUI(x){return`<div class="check ${['warn','urgent'].includes(x.status)?'issue':''}" data-id="${x.id}"><div class="check-top"><b>${esc(x.name)}</b><div class="status">${[['ok','✓ OK'],['warn','△ Προσοχή'],['urgent','! Επείγον'],['na','N/A'],['nt','Not Tested'],['noaccess','No Access']].map(([s,l])=>`<button data-s="${s}" class="${x.status===s?'on':''}" onclick="setStatus('${x.id}','${s}')">${l}</button>`).join('')}</div></div>${issueUI(x)}</div>`}
function issueUI(x){return`<div class="detail"><div class="grid"><label class="field full">Issue / observation *<textarea onchange="findItem('${x.id}').detail=this.value">${esc(x.detail)}</textarea></label><label class="field">Technician required?<select onchange="findItem('${x.id}').tech=this.value"><option>No</option><option ${x.tech==='Yes'?'selected':''}>Yes</option></select></label><label class="field">Technician type<select onchange="findItem('${x.id}').techType=this.value">${['','Plumber','Electrician','HVAC','Appliance Technician','Locksmith','Pool Technician','General Technician','Other'].map(v=>`<option ${x.techType===v?'selected':''}>${v}</option>`)}</select></label><label class="field">Priority / timing<select onchange="findItem('${x.id}').priority=this.value">${['Monitor','Within 30 days','Within 7 days','Immediate'].map(v=>`<option ${x.priority===v?'selected':''}>${v}</option>`)}</select></label><label class="field">Responsibility<select onchange="findItem('${x.id}').responsibility=this.value">${['Owner','Possible Tenant','Building / Common Area','Undetermined'].map(v=>`<option ${x.responsibility===v?'selected':''}>${v}</option>`)}</select></label><label class="field">Previous issue?<select onchange="findItem('${x.id}').follow=this.value"><option>No</option><option ${x.follow==='Yes'?'selected':''}>Yes</option></select></label><label class="field">Follow-up state<select onchange="findItem('${x.id}').followState=this.value">${['','Resolved','Improved','Unchanged','Worse','New issue'].map(v=>`<option ${x.followState===v?'selected':''}>${v}</option>`)}</select></label></div><div class="actions"><button class="ghost" onclick="pickPhotos('item','${x.id}')">📷 Add Photo</button></div><div class="photos">${photoTiles(x.photos,'item',x.id)}</div>${x.status==='urgent'&&!x.photos.length?`<label class="field">Required if urgent photo is unavailable<textarea placeholder="Document why a photo could not be taken" onchange="findItem('${x.id}').photoReason=this.value">${esc(x.photoReason)}</textarea></label>`:''}</div>`}
function setStatus(id,s){findItem(id).status=s;render()}
function pickPhotos(kind,id){state.photoTarget={kind,id};photoInput.click()}
photoInput.onchange=async e=>{let files=[...e.target.files];for(const f of files){let data=await readAndScale(f);let p={id:uid(),src:data.src,bytes:data.bytes,type:'Normal',caption:''};if(state.photoTarget.kind==='area')findArea(state.photoTarget.id).overview.push(p);else findItem(state.photoTarget.id).photos.push(p);state.photoBytes+=p.bytes}e.target.value='';render()}
function readAndScale(file){return new Promise(res=>{let r=new FileReader;r.onload=()=>{let im=new Image;im.onload=()=>{let quality=state.meta.quality||'High',max=quality==='Maximum'?3840:quality==='Standard'?1800:3000,scale=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);let src=c.toDataURL('image/jpeg',quality==='Maximum'?.94:quality==='Standard'?.78:.88);res({src,bytes:Math.round(src.length*.75)})};im.src=r.result};r.readAsDataURL(file)})}
function photoTiles(arr,kind,id){return arr.map((p,i)=>`<div class="photo"><img src="${p.src}"><button onclick="removePhoto('${kind}','${id}',${i})">×</button><div class="meta"><select onchange="photoAt('${kind}','${id}',${i}).type=this.value">${['Normal','Issue','Equipment Label','Meter'].map(v=>`<option ${p.type===v?'selected':''}>${v}</option>`)}</select><input placeholder="Optional caption" value="${esc(p.caption)}" onchange="photoAt('${kind}','${id}',${i}).caption=this.value"></div></div>`).join('')}
function photoAt(k,id,i){return(k==='area'?findArea(id).overview:findItem(id).photos)[i]}function removePhoto(k,id,i){let a=k==='area'?findArea(id).overview:findItem(id).photos;state.photoBytes-=a[i].bytes;a.splice(i,1);render()}
function bindInputs(){document.querySelectorAll('[data-meta]').forEach(el=>el.onchange=()=>{state.meta[el.dataset.meta]=el.type==='checkbox'?el.checked:el.value;if(['propertyType','multi','quality'].includes(el.dataset.meta))render()})}
function counts(){let a=allItems(),ok=a.filter(x=>x.status==='ok').length,w=a.filter(x=>x.status==='warn').length,u=a.filter(x=>x.status==='urgent').length;return{ok,w,u,total:a.length,done:a.filter(x=>x.status).length}}
function findings(){return allItems().filter(x=>['warn','urgent'].includes(x.status))}
function validate(){let errs=[];if(!state.meta.address)errs.push('Property address is required.');findings().forEach(x=>{if(!x.detail.trim())errs.push(`${x.name}: describe the issue.`);if(x.status==='urgent'&&!x.photos.length&&!x.photoReason.trim())errs.push(`${x.name}: urgent findings need a photo or documented reason.`)});return errs}
function reviewUI(){let c=counts(),fs=findings(),errs=validate();return`<div class="eyebrow">Final review</div><h2>Landlord summary & PDF</h2><div class="summary-grid"><div class="stat"><b>${state.areas.length}</b>Areas</div><div class="stat"><b>${c.ok}</b>✓ OK</div><div class="stat"><b>${c.w}</b>△ Προσοχή</div><div class="stat"><b>${c.u}</b>! Επείγον</div><div class="stat"><b>${fs.some(x=>x.tech==='Yes')?'Yes':'No'}</b>Technician</div></div>${errs.length?`<div class="notice"><b>Please complete:</b><br>${errs.map(esc).join('<br>')}</div>`:''}<div class="sectionbar"><h3>Prioritized recommended actions</h3></div><p class="muted">Generated automatically from yellow and red findings—no retyping.</p><div class="findings">${fs.sort((a,b)=>b.status.localeCompare(a.status)).map(x=>`<div class="finding ${x.status}"><b>${x.status==='urgent'?'! Επείγον':'△ Προσοχή'} — ${esc(x.name)}</b><br>${esc(x.detail)||'<span class="muted">Description needed</span>'}<br><small>${esc(x.priority)} · ${esc(x.responsibility)}${x.tech==='Yes'?' · '+esc(x.techType||'Technician recommended'):''}</small></div>`).join('')||'<div class="notice">No yellow or red findings recorded.</div>'}</div><div class="grid" style="margin-top:20px">${selectF('PDF photo quality','quality',['Standard','High','Maximum'])}${field('Custom PDF filename (optional)','filename')}</div><p>Estimated image data: <span class="estimate">${formatBytes(state.photoBytes)}</span>. Final PDF size depends on the browser’s PDF engine.</p>${footer()}`}
function formatBytes(n){return n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(1)+' MB'}
function slug(s){return(s||'Property').replace(/[^a-z0-9α-ωΑ-Ω]+/gi,'_').replace(/^_|_$/g,'').slice(0,60)}
function reportHeader(){return`<div class="pdf-header"><div class="logo">KEDRON</div><div class="pdf-title">KEDRON INSPECTION REPORT</div><div class="pdf-address">${esc(state.meta.address||'Property address')}</div></div>`}
function reportFooter(i,n){return`<div class="pdf-footer"><span>KEDRON · Long-Term Property Management</span><span>Page ${i} of ${n}</span></div>`}
function blockMeta(){return`<div class="pdf-meta"><div><b>Inspection date</b><br>${esc(state.meta.date)}</div><div><b>Property reference</b><br>${esc(state.meta.ref||'—')}</div><div><b>Inspection type</b><br>${esc(state.meta.type)}</div><div><b>Inspector</b><br>${esc(state.meta.inspector||'—')}</div><div><b>Tenant attendance</b><br>${esc(state.meta.tenant)}</div><div><b>Access</b><br>${esc(state.meta.access)}</div></div>`}
function partyBlock(){let landlord=[state.meta.landlordName,state.meta.landlordPhone,state.meta.landlordEmail].filter(Boolean).map(esc).join(' · ')||'Not provided',tenant=[state.meta.tenantName,state.meta.tenantPhone,state.meta.tenantEmail].filter(Boolean).map(esc).join(' · ')||'Not provided';return`<div class="pdf-section"><h3>Landlord & Tenant / Client Information</h3><p><b>Landlord:</b> ${landlord}</p><p><b>Tenant / client:</b> ${tenant}</p>${state.meta.tenantIssues?`<p><b>Tenant-reported issues:</b><br>${esc(state.meta.tenantIssues)}</p>`:'<p><b>Tenant-reported issues:</b> None recorded</p>'}</div>`}
function itemHTML(x){let lab={ok:'✓ OK',warn:'△ Προσοχή',urgent:'! Επείγον',na:'Not Applicable',nt:'Not Tested',noaccess:'No Access'}[x.status]||'Not recorded';return`<div class="pdf-item"><b>${esc(x.name)}</b> <span class="pdf-status ${x.status}">${lab}</span>${x.location?`<span class="muted"> · ${esc(x.location)}</span>`:''}${x.brand?`<br><small>${esc(x.brand)}${x.serial?' · Serial: '+esc(x.serial):''}</small>`:''}${x.detail?`<br>${esc(x.detail)}`:''}${['warn','urgent'].includes(x.status)?`<br><small><b>Action:</b> ${esc(x.priority)} · <b>Responsibility:</b> ${esc(x.responsibility)}${x.tech==='Yes'?' · <b>Technician:</b> '+esc(x.techType||'Recommended'):''}${x.follow==='Yes'?' · <b>Follow-up:</b> '+esc(x.followState||'Previous issue'):''}</small>`:''}${x.photoReason?`<br><small><b>Photo unavailable:</b> ${esc(x.photoReason)}</small>`:''}${x.photos.map(p=>`<figure style="margin:3mm 0"><img class="pdf-photo" src="${p.src}"><figcaption>${esc(p.type)}${p.caption?' — '+esc(p.caption):''}</figcaption></figure>`).join('')}</div>`}
function previewReport(){let errs=validate();if(errs.length&&!confirm('The report has incomplete required information:\n\n'+errs.join('\n')+'\n\nPreview anyway?'))return;let c=counts(),fs=findings(),sections=[];sections.push(`<div class="cover-mark"></div>`);sections.push(blockMeta());sections.push(partyBlock());sections.push(`<div class="pdf-summary"><div><b>${state.areas.length}</b>Areas</div><div><b>${c.ok}</b>✓ OK</div><div><b>${c.w}</b>△ Προσοχή</div><div><b>${c.u}</b>! Επείγον</div><div><b>${fs.some(x=>x.tech==='Yes')?'YES':'NO'}</b>Technician</div></div>`);sections.push(`<div class="pdf-section"><h3>Overall Status: ${c.u?'! Επείγον':c.w?'△ Προσοχή':'✓ OK'}</h3></div>`);sections.push(`<div class="pdf-section"><h3>Priority Findings & Recommended Actions</h3>${fs.map(itemHTML).join('')||'<p>No attention or urgent findings recorded.</p>'}</div>`);
state.areas.forEach(a=>sections.push(`<div class="pdf-section"><h3>${esc(a.name)} <small>· ${esc(a.level)}</small></h3>${a.overview.map(p=>`<figure><img class="pdf-photo" src="${p.src}"><figcaption>Room overview${p.caption?' — '+esc(p.caption):''}</figcaption></figure>`).join('')}${a.items.map(itemHTML).join('')}</div>`));
[['Systems & Equipment',state.equipment],['Landlord-Owned Appliances & Furnishings',state.appliances],...GENERAL.map(([g])=>[g,state.general.filter(x=>x.group===g)])].forEach(([h,a])=>{if(a.length)sections.push(`<div class="pdf-section"><h3>${h}</h3>${a.map(itemHTML).join('')}</div>`)});
report.style.display='block';document.body.style.overflow='hidden';paginate(sections);sizeEstimate.textContent='Estimated images: '+formatBytes(state.photoBytes);}
function paginate(blocks){reportPages.innerHTML='';let pages=[];function page(){let p=document.createElement('section');p.className='pdf-page';p.innerHTML=reportHeader()+'<div class="page-body"></div>';reportPages.appendChild(p);pages.push(p);return p.querySelector('.page-body')}let body=page();blocks.forEach(html=>{let wrap=document.createElement('div');wrap.innerHTML=html;[...wrap.children].forEach(node=>{body.appendChild(node);if(body.scrollHeight>body.clientHeight+1){body.removeChild(node);body=page();body.appendChild(node)}})});pages.forEach((p,i)=>p.insertAdjacentHTML('beforeend',reportFooter(i+1,pages.length)));}
function closeReport(){report.style.display='none';document.body.style.overflow=''}
function printReport(){let base=state.meta.filename||`KEDRON_Inspection_${slug(state.meta.ref||state.meta.address)}_${state.meta.date}`;document.title=base.replace(/\.pdf$/i,'');window.print();setTimeout(()=>document.title='KEDRON Long-Term Property Inspection',500)}
init();
</script>
</body></html>
